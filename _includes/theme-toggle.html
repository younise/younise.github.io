<script>
document.addEventListener('DOMContentLoaded', function() {
  const modeToggle = document.getElementById('mode-toggle');
  if (modeToggle) {
    const sunIcon = modeToggle.querySelector('.sun-icon');
    const moonIcon = modeToggle.querySelector('.moon-icon');
    
    function getCurrentTheme() {
      // Check the actual theme setting first (this is most reliable)
      const dataMode = document.documentElement.getAttribute('data-mode');
      
      // If data-mode is explicitly set, use it
      if (dataMode === 'dark') {
        return true; // Dark mode
      } else if (dataMode === 'light') {
        return false; // Light mode
      }
      
      // Fallback to system preference only if no explicit setting
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      
      console.log('Theme detection:', {
        dataMode,
        systemPrefersDark,
        usingSystemPreference: dataMode === null
      });
      
      return systemPrefersDark;
    }
    
    function updateThemeIcons() {
      const isDark = getCurrentTheme();
      
      console.log('Updating theme icons. isDark:', isDark);
      console.log('sunIcon element:', sunIcon);
      console.log('moonIcon element:', moonIcon);
      
      if (isDark) {
        // Dark mode: show orange sun, hide moon
        if (sunIcon) {
          sunIcon.style.cssText = 'display: inline-block !important; color: #ff8c00 !important; visibility: visible !important; font-size: 1.2rem !important;';
          console.log('After setting sun styles:', {
            display: sunIcon.style.display,
            color: sunIcon.style.color,
            visibility: sunIcon.style.visibility,
            computed: window.getComputedStyle(sunIcon).display
          });
        }
        if (moonIcon) {
          moonIcon.style.cssText = 'display: none !important; visibility: hidden !important;';
          console.log('After setting moon styles:', {
            display: moonIcon.style.display,
            visibility: moonIcon.style.visibility,
            computed: window.getComputedStyle(moonIcon).display
          });
        }
        console.log('Set to dark mode: sun visible, moon hidden');
      } else {
        // Light mode: show blue moon, hide sun
        if (moonIcon) {
          moonIcon.style.cssText = 'display: inline-block !important; color: #007bff !important; visibility: visible !important; font-size: 1.2rem !important;';
          console.log('After setting moon styles:', {
            display: moonIcon.style.display,
            color: moonIcon.style.color,
            visibility: moonIcon.style.visibility,
            computed: window.getComputedStyle(moonIcon).display
          });
        }
        if (sunIcon) {
          sunIcon.style.cssText = 'display: none !important; visibility: hidden !important;';
          console.log('After setting sun styles:', {
            display: sunIcon.style.display,
            visibility: sunIcon.style.visibility,
            computed: window.getComputedStyle(sunIcon).display
          });
        }
        console.log('Set to light mode: moon visible, sun hidden');
      }
    }
    
    // Update icons on page load
    setTimeout(updateThemeIcons, 100);
    
    // Update icons when theme toggle is clicked
    modeToggle.addEventListener('click', function(e) {
      console.log('Mode toggle clicked');
      setTimeout(updateThemeIcons, 100); // Delay to let theme change
    });
    
    // Listen for theme changes from other sources
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && 
            (mutation.attributeName === 'data-mode' || mutation.attributeName === 'class')) {
          console.log('Theme attribute changed:', mutation.attributeName);
          updateThemeIcons();
        }
      });
    });
    
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-mode', 'class']
    });
    
    // Also observe body class changes
    observer.observe(document.body, {
      attributes: true,
      attributeFilter: ['class']
    });
    
    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      console.log('System theme changed:', e.matches);
      updateThemeIcons();
    });
  }
});
</script>
