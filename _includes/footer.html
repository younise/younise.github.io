<!-- The Footer -->

<footer>
  <div class="footer-shell py-3">
    <div class="footer-flex d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center text-muted gap-2 gap-lg-0">
      <div class="footer-left">
        <p class="mb-0">
          Copyright © {{ 'now' | date: "%Y" }}
          {{ site.title }}
        </p>
      </div>

  <div class="footer-right">
        <p class="mb-0">
          <!--
          {%- capture _platform -%}
          <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>
          {%- endcapture -%}

          {%- capture _theme -%}
          <a href="https://github.com/cotes2020/jekyll-theme-chirpy" target="_blank" rel="noopener">Chirpy</a>
          {%- endcapture -%}
          
          {{ site.data.locales[site.lang].meta
            | default: 'Using the :PLATFORM theme :THEME.'
            | replace: ':PLATFORM', _platform | replace: ':THEME', _theme
          }}
          -->
        </p>
      </div>
    </div>
  </div>
</footer>
