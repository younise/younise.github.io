<!-- Stay Connected section -->
<div class="sidebar-bottom d-flex flex-column w-100 mt-auto">
  <div class="stay-connected text-center mb-3">
    <div style="border-top: 1px solid var(--main-border-color); margin-bottom: 1rem;"></div>
    <h6 class="text-muted mb-3" style="font-size: 14.4px; letter-spacing: 1px; font-weight: 600;">STAY CONNECTED</h6>
    
    <div class="social-icons d-flex justify-content-center flex-wrap align-items-center">
      <!-- Theme Toggle -->
      {% unless site.theme_mode %}
      <button type="button" class="btn btn-link nav-link mx-2 mb-2" aria-label="Switch Mode" id="mode-toggle" title="Toggle Theme">
        <i class="fas fa-adjust"></i>
      </button>
      {% endunless %}

      <!-- GitHub -->
      <a href="https://github.com/{{ site.github.username }}" class="mx-2 mb-2" title="GitHub" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github"></i>
      </a>
      
      <!-- Twitter -->
      <a href="https://twitter.com/{{ site.twitter.username }}" class="mx-2 mb-2" title="Twitter" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      
      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/{{ site.linkedin.username }}" class="mx-2 mb-2" title="LinkedIn" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-linkedin"></i>
      </a>
      
      <!-- Email -->
      <a href="mailto:{{ site.social.email }}" class="mx-2 mb-2" title="Email">
        <i class="fas fa-envelope"></i>
      </a>
      
      <!-- RSS -->
      <a href="{{ '/feed.xml' | relative_url }}" class="mx-2 mb-2" title="RSS">
        <i class="fas fa-rss"></i>
      </a>
    </div>
  </div>
</div>
